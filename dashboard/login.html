<!-- /dashboard/login.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مرموش ستور</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page-bg">

    <div class="login-split-container">

        <!-- Right Side: Login Form (RTL means this is on the right visually) -->
        <div class="login-right">
            <div class="d-flex flex-column align-items-center mb-4 text-center">
                <img src="../assets/logo.jpeg" alt="Marmoush Store Logo" class="mb-3" style="width: 80px; height: 80px; border-radius: 50%; box-shadow: 0 0 15px rgba(13, 110, 253, 0.4);">
                <h3 class="fw-bold mb-1 text-white">تسجيل الدخول</h3>
                <p class="login-subtitle">مرحباً بك في لوحة إدارة <span class="text-primary fw-bold">مرموش ستور</span>
                </p>
            </div>

            <div id="login-error" class="alert alert-danger d-none font-sm text-center" role="alert">
                البريد الإلكتروني أو كلمة المرور غير صحيحة.
            </div>

            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label-custom mb-2">البريد الإلكتروني</label>
                    <div class="login-input-group">
                        <i class='bx bx-envelope'></i>
                        <input type="email" class="form-control form-control-login" id="login-email" required
                            placeholder="أدخل بريدك الإلكتروني" dir="rtl">
                    </div>
                </div>

                <div class="mb-2">
                    <label class="form-label-custom mb-2">كلمة المرور</label>
                    <div class="password-wrapper">
                        <i class='bx bx-lock-alt' style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                        <input type="password" class="form-control form-control-login" id="login-password" required
                            placeholder="أدخل كلمة المرور" dir="rtl" style="padding-right: 45px !important;">
                        <button type="button" id="toggle-login-password" class="password-toggle-icon">
                            <i class='bx bx-show fs-5'></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 mt-3 font-sm">
                    <a href="#" class="text-primary text-decoration-none fw-bold">نسيت كلمة المرور؟</a>
                    <div class="form-check m-0">
                        <input class="form-check-input bg-transparent border-secondary" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-light-custom" for="rememberMe">تذكرني</label>
                    </div>
                </div>

                <!-- Removed the extra login button and made this the main submit button -->
                <button type="submit" class="btn-login-outline w-100 mb-4 py-3"
                    style="border-color: rgba(13, 110, 253, 0.5); color: #f3f4f6;">
                    تسجيل الدخول كمدير <i class='bx bx-check-shield fs-4 text-primary'></i>
                </button>


            </form>
        </div>

        <!-- Left Side: Branding Image & Features (RTL visually left) -->
        <div class="login-left">
            <div>
                <h2 class="fw-bold text-white mb-1">مرموش ستور</h2>
                <h5 class="text-primary mb-3">Marmoush Store</h5>
                <p class="login-subtitle">كل ما تحتاجه من منتجات رياضية أصلية</p>
            </div>



            <div class="login-features">
                <div class="feature-item">
                    <!-- Changed icon to a medal/award for "original products" -->
                    <i class='bx bx-award'></i>
                    <h6 class="text-white mt-2">منتجات أصلية</h6>
                    <small>جودة مضمونة 100%</small>
                </div>
                <div class="feature-item">
                    <!-- Shield Icon -->
                    <i class='bx bx-check-shield' style="font-size: 2rem;"></i>
                    <h6 class="text-white mt-2">أمان وحماية</h6>
                    <small>تسوق بثقة وأمان</small>
                </div>
                <div class="feature-item">
                    <!-- Custom SVG for fast shipping -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
                        style="fill: var(--primary-color);">
                        <path
                            d="M19.15 8a2 2 0 0 0-1.72-1H15V5a1 1 0 0 0-1-1H4a2 2 0 0 0-2 2v10a2 2 0 0 0 1 1.73 3.49 3.49 0 0 0 7 .27h3.1a3.48 3.48 0 0 0 6.9 0 2 2 0 0 0 2-2v-3a1.07 1.07 0 0 0-.14-.52zM15 9h2.43l1.8 3H15zM6.5 19A1.5 1.5 0 1 1 8 17.5 1.5 1.5 0 0 1 6.5 19zm10 0a1.5 1.5 0 1 1 1.5-1.5 1.5 1.5 0 0 1-1.5 1.5z">
                        </path>
                    </svg>
                    <h6 class="text-white mt-2">شحن سريع</h6>
                    <small>توصيل لجميع المناطق</small>
                </div>
            </div>
        </div>

    </div>

    <!-- Toast Notification -->
    <div class="toast-container-custom" id="toast-notification">
        <div class="custom-toast" id="toast-body">
            <i class='bx bx-error-circle icon text-danger' id="toast-icon"></i>
            <span id="toast-msg"></span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/pages/login.js"></script>
</body>

</html>
